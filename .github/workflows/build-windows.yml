name: Build Nova.exe

on:
  workflow_dispatch:          # lets you press "Run workflow" on the Actions tab
  push:
    tags: ["v*"]              # tagging v1.0.1 etc. also publishes a Release

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bake in the CurseForge key (from the CURSEFORGE_KEY repository secret, if set)
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
        run: python -c "import os; open('nova/_secrets.py','w').write('CURSEFORGE_KEY = ' + repr(os.environ.get('CURSEFORGE_KEY', '').strip()) + '\n')"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - name: Build Nova.exe (no console window)
        run: pyinstaller --onefile --noconsole --name Nova --add-data "nova/ui;nova/ui" nova.py
      - name: Build Nova-debug.exe (shows a console, for troubleshooting)
        run: pyinstaller --onefile --name Nova-debug --add-data "nova/ui;nova/ui" nova.py
      - name: Build NovaRoblox.exe (the Roblox launcher, no console window)
        run: pyinstaller --onefile --noconsole --name NovaRoblox --add-data "nova/ui;nova/ui" novarbx.py
      - name: Build NovaRoblox-debug.exe (shows a console, for troubleshooting)
        run: pyinstaller --onefile --name NovaRoblox-debug --add-data "nova/ui;nova/ui" novarbx.py
      - name: Smoke test the exes
        run: |
          dist\Nova-debug.exe --version
          dist\NovaRoblox-debug.exe --version
          $p = Start-Process dist\Nova.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Nova.exe exited with $($p.ExitCode)" }
          $p = Start-Process dist\NovaRoblox.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NovaRoblox.exe exited with $($p.ExitCode)" }
      - name: Check the weather window can open (tkinter is bundled)
        continue-on-error: true
        run: |
          $p = Start-Process dist\NovaRoblox-debug.exe -ArgumentList "--weather-selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "weather window selftest exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-windows
          path: dist/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Nova Launcher (latest build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: dist/*.exe
