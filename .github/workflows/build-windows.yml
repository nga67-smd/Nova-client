name: Build Nova.exe

on:
  workflow_dispatch:          # lets you press "Run workflow" on the Actions tab
  push:
    tags: ["v*"]              # tagging v1.0.1 etc. also publishes a Release

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - name: Build Nova.exe (no console window)
        run: pyinstaller --onefile --noconsole --name Nova --add-data "nova/ui;nova/ui" nova.py
      - name: Build Nova-debug.exe (shows a console, for troubleshooting)
        run: pyinstaller --onefile --name Nova-debug --add-data "nova/ui;nova/ui" nova.py
      - name: Smoke test the exes
        run: |
          dist\Nova-debug.exe --version
          $p = Start-Process dist\Nova.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Nova.exe exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-windows
          path: dist/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Nova Launcher (latest build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: dist/*.exe
