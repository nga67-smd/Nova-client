name: Build Nova Visuals mod

on:
  workflow_dispatch:
  push:
    paths: ["visuals-mod/**", ".github/workflows/build-visuals.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.4", gradle: "8.14.3", loom: "1.10-SNAPSHOT" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Look up the newest matching Fabric versions
        env:
          MC: ${{ matrix.mc }}
          LOOM: ${{ matrix.loom }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          mc = os.environ["MC"]
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "nova-visuals-build"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          yarn = get(f"https://meta.fabricmc.net/v2/versions/yarn/{mc}")[0]["version"]
          loader = [l for l in get("https://meta.fabricmc.net/v2/versions/loader") if l["stable"]][0]["version"]
          q = f"game_versions=%5B%22{mc}%22%5D&loaders=%5B%22fabric%22%5D"
          fapi = get(f"https://api.modrinth.com/v2/project/fabric-api/version?{q}")[0]["version_number"]
          p = "visuals-mod/gradle.properties"
          s = open(p).read()
          for k, v in (("loom_version", os.environ["LOOM"]), ("minecraft_version", mc), ("yarn_mappings", yarn), ("loader_version", loader), ("fabric_version", fapi)):
              s = re.sub(rf"^{k}=.*$", f"{k}={v}", s, flags=re.M)
          open(p, "w").write(s)
          print(s)
          PY
      - name: Build
        working-directory: visuals-mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nova-visuals-${{ matrix.mc }}
          path: visuals-mod/build/libs/*.jar
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: visuals-latest
          name: Nova Visuals (latest build)
          prerelease: true
          files: visuals-mod/build/libs/*.jar
