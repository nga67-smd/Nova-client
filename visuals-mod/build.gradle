plugins {
    id 'fabric-loom'   // version comes from loom_version in gradle.properties (see settings.gradle)
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = 'dev.nova'
base { archivesName = 'nova-visuals' }

// Version-specific sources (the few calls whose names differ) live in versions/<minecraft_version>/java
sourceSets.main.java.srcDir "versions/${project.minecraft_version}/java"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def mcRange = project.minecraft_version == '1.21.1' ? '>=1.21 <=1.21.1' : ">=${project.minecraft_version} <=${project.minecraft_version}"
    inputs.property 'version', project.version
    inputs.property 'mcRange', mcRange
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'mcRange': mcRange }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
