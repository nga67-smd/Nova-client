<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Launcher</title>
<link rel="icon" href="/static/nova.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script>window.NOVA_TOKEN = "__NOVA_TOKEN__";</script>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand">
      <svg viewBox="0 0 64 64" class="brand-mark" aria-hidden="true"><use href="/static/nova.svg#nova"/></svg>
      <span class="brand-name">Nova</span>
    </div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot">
      <button class="profile" id="profile" title="Switch player profile"></button>
      <div class="ver" id="ver"></div>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div id="tray" class="tray" aria-live="polite"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="/static/app.js"></script>
</body>
</html>
